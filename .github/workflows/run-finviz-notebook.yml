name: Run Finviz Stock Metrics

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker to retrieve from Finviz"
        required: true
        default: "AMD"
        type: string

permissions:
  contents: read

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute notebook
        working-directory: notebooks
        env:
          TICKER: ${{ inputs.ticker }}
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute Finviz_Stock_Metrics.ipynb \
            --output Finviz_Stock_Metrics_executed.ipynb \
            --output-dir ../outputs \
            --ExecutePreprocessor.timeout=600

      - name: Upload notebook and generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finviz-${{ inputs.ticker }}-results
          path: |
            outputs/
          if-no-files-found: warn
          retention-days: 14
