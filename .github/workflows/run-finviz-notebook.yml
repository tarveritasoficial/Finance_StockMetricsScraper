name: Run Finviz Stock Metrics

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker to retrieve from Finviz"
        required: true
        default: "AMD"
        type: string

permissions:
  contents: write

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute notebook
        working-directory: notebooks
        env:
          TICKER: ${{ inputs.ticker }}
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute Finviz_Stock_Metrics.ipynb \
            --output Finviz_Stock_Metrics_executed.ipynb \
            --output-dir ../outputs \
            --ExecutePreprocessor.timeout=600

      - name: Commit and push JSON and PNG to repository
        if: success()
        env:
          TICKER: ${{ inputs.ticker }}
        run: |
          set -euo pipefail
          JSON_FILE="outputs/${TICKER}_valuation_metrics.json"
          PNG_FILE="outputs/${TICKER}_valuation_multiples.png"

          echo "Checking generated files..."
          test -s "$JSON_FILE" || { echo "Missing or empty JSON: $JSON_FILE"; exit 1; }
          test -s "$PNG_FILE" || { echo "Missing or empty PNG: $PNG_FILE"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$JSON_FILE" "$PNG_FILE"
          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit; repository already contains the latest outputs."
          else
            git commit -m "Update Finviz metrics for ${TICKER}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload notebook and generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finviz-${{ inputs.ticker }}-results
          path: |
            outputs/
          if-no-files-found: warn
          retention-days: 14
